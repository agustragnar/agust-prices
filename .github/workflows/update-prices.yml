name: Update Prices Daily

on:
  schedule:
    # Runs every day at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Fetch live prices
        run: python scripts/fetch_prices.py
      
      - name: Commit and push if changed
        run: |
          git config user.name "Price Bot"
          git config user.email "prices@agustragnar.com"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices - $(date +'%Y-%m-%d %H:%M:%S UTC')" && git push)
