name: Update Prices Daily

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests --quiet
      
      - name: Fetch live prices
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime
          import requests
          import time
          
          prices = {}
          errors = []
          
          # Crypto - CoinGecko
          try:
              r = requests.get("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd", timeout=10)
              if r.status_code == 200:
                  prices['BTC'] = r.json()['bitcoin']['usd']
          except Exception as e:
              errors.append(f"BTC: {str(e)}")
          
          # Stocks
          tickers = ['MSTY', 'TSLY', 'MSTR', 'SWC', 'MPJPY', 'ASST', 'STRD', 'STRK', 'STRC', 'SATA']
          
          for ticker in tickers:
              price = None
              
              # Try Finnhub first
              try:
                  r = requests.get(f"https://finnhub.io/api/v1/quote?symbol={ticker}&token=demo", timeout=10)
                  if r.status_code == 200 and r.json().get('c'):
                      price = r.json()['c']
              except:
                  pass
              
              # Try Yahoo as fallback
              if not price:
                  try:
                      r = requests.get(f"https://query2.finance.yahoo.com/v10/finance/quoteSummary/{ticker}?modules=price", timeout=10, headers={'User-Agent': 'Mozilla/5.0'})
                      if r.status_code == 200:
                          price = r.json()['quoteSummary']['result'][0]['price']['regularMarketPrice']['raw']
                  except:
                      pass
              
              if price:
                  prices[ticker] = round(price, 2)
              else:
                  errors.append(f"{ticker}: Could not fetch")
              
              time.sleep(0.3)
          
          data = {
              "prices": prices,
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "errors": errors
          }
          
          with open('prices.json', 'w') as f:
              json.dump(data, f, indent=2)
          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices - $(date +'%Y-%m-%d %H:%M UTC')" && git push)
